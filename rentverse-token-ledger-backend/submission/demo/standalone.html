<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Token Ledger API — Standalone Demo</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 680px; margin: 40px auto; color: #1f2933; }
  h1 { font-size: 20px; }
  section { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  input { padding: 8px; margin-right: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
  button { padding: 8px 14px; border: none; border-radius: 6px; background: #059669; color: white; cursor: pointer; }
  button:hover { background: #047857; }
  pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
  label { display: block; font-size: 13px; color: #475569; margin-bottom: 4px; }
</style>
</head>
<body>
  <h1>Token Ledger API — standalone demo (no React needed)</h1>
  <p>Point this at your running backend. Useful for a quick screen recording of mint/transfer/balance without needing the full frontend build.</p>

  <section>
    <label>API base URL</label>
    <input id="baseUrl" value="http://localhost:5000/api/token" style="width: 340px" />
  </section>

  <section>
    <h3>Mint</h3>
    <label>To address</label>
    <input id="mintTo" value="0xAAA0000000000000000000000000000000AAA0" style="width: 340px" />
    <label>Amount</label>
    <input id="mintAmount" type="number" value="100" style="width: 100px" />
    <button onclick="mint()">Mint</button>
  </section>

  <section>
    <h3>Transfer</h3>
    <label>From</label>
    <input id="xferFrom" value="0xAAA0000000000000000000000000000000AAA0" style="width: 340px" />
    <label>To</label>
    <input id="xferTo" value="0xBBB0000000000000000000000000000000BBB0" style="width: 340px" />
    <label>Amount</label>
    <input id="xferAmount" type="number" value="25" style="width: 100px" />
    <button onclick="transfer()">Transfer</button>
  </section>

  <section>
    <h3>Balance</h3>
    <input id="balAddress" value="0xAAA0000000000000000000000000000000AAA0" style="width: 340px" />
    <button onclick="balance()">Check balance</button>
  </section>

  <section>
    <h3>History &amp; chain integrity</h3>
    <button onclick="history_()">Full history</button>
    <button onclick="verify()">Verify chain</button>
  </section>

  <h3>Response</h3>
  <pre id="output">—</pre>

<script>
  const base = () => document.getElementById('baseUrl').value.replace(/\/$/, '');
  const show = (data) => { document.getElementById('output').textContent = JSON.stringify(data, null, 2); };
  const post = (path, body) => fetch(base() + path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  }).then(r => r.json()).then(show).catch(e => show({ error: String(e) }));
  const get = (path) => fetch(base() + path).then(r => r.json()).then(show).catch(e => show({ error: String(e) }));

  function mint() {
    post('/mint', { to: document.getElementById('mintTo').value, amount: Number(document.getElementById('mintAmount').value) });
  }
  function transfer() {
    post('/transfer', {
      from: document.getElementById('xferFrom').value,
      to: document.getElementById('xferTo').value,
      amount: Number(document.getElementById('xferAmount').value),
    });
  }
  function balance() {
    get('/balance/' + encodeURIComponent(document.getElementById('balAddress').value));
  }
  function history_() { get('/transactions'); }
  function verify() { get('/verify'); }
</script>
</body>
</html>
